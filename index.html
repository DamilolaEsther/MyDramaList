<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MyDramaList</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <h1>MyDramaList</h1>
    <p>Hover for plot. Click for genre. Mouse out to reset.</p>
  </header>

  <div class="wrapper">
    <div class="card" data-title="Bad and Crazy" data-actor="Lee Dong Wook" data-plot="A crazy cop with a split personality fights corruption." data-genre="Action / Psychological">
      <img src="badandcrazy.jpg" alt="Bad and Crazy" />
      <p>Bad and Crazy<br><span>Lee Dong Wook</span></p>
    </div>

    <div class="card" data-title="Bloodhounds" data-actor="Woo Do Hwan" data-plot="Two boxers take on a ruthless loan shark." data-genre="Action / Crime">
      <img src="bloodhounds.jpg" alt="Bloodhounds" />
      <p>Bloodhounds<br><span>Woo Do Hwan</span></p>
    </div>

    <div class="card" data-title="Study Group" data-actor="Hwang Min Hyun" data-plot="A student uses fists instead of books to survive high school." data-genre="School / Action">
      <img src="studygroup.jpg" alt="Study Group" />
      <p>Study Group<br><span>Hwang Min Hyun</span></p>
    </div>

    <div class="card" data-title="Undercover High School" data-actor="Kim Dong Wook" data-plot="An undercover cop poses as a student." data-genre="Action / Thriller">
      <img src="undercover.jpg" alt="Undercover High School" />
      <p>Undercover High School<br><span>Kim Dong Wook</span></p>
    </div>

    <div class="card" data-title="Squid Game" data-actor="Lee Jung Jae" data-plot="456 players risk it all in deadly childhood games." data-genre="Survival / Drama">
      <img src="squidgame.jpg" alt="Squid Game" />
      <p>Squid Game<br><span>Lee Jung Jae</span></p>
    </div>
  </div>
</body>
</html>
